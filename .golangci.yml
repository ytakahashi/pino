version: "2"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ytakahashi/pino)

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - exhaustive
    - misspell
  settings:
    exhaustive:
      # Do not let a default clause hide a missing case. Several enums
      # (LineKind, Mode, Kind, Role, ChangeStatus) are expected to gain
      # values later.
      default-signifies-exhaustive: false
    depguard:
      # Enforces the layering: presentation -> application -> domain,
      # with infrastructure depending on domain and the ports only.
      # Concrete adapters are injected by cli, which is the sole place
      # allowed to import infrastructure.
      rules:
        domain:
          files:
            - '**/internal/domain/**'
          deny:
            - pkg: github.com/ytakahashi/pino/internal/application
            - pkg: github.com/ytakahashi/pino/internal/infrastructure
            - pkg: github.com/ytakahashi/pino/internal/presentation
            - pkg: github.com/tailscale/hujson
              desc: the parser stays inside infrastructure
            # Bubble Tea and Lip Gloss are published under charm.land; the
            # github.com path still covers the pieces they pull in, such as
            # x/ansi and colorprofile.
            - pkg: charm.land
              desc: UI libraries stay inside presentation
            - pkg: github.com/charmbracelet
              desc: UI libraries stay inside presentation
        application:
          files:
            - '**/internal/application/**'
          deny:
            - pkg: github.com/ytakahashi/pino/internal/infrastructure
              desc: use the ports; cli injects the concrete adapters
            - pkg: github.com/ytakahashi/pino/internal/presentation
            - pkg: github.com/tailscale/hujson
            - pkg: charm.land
              desc: rendering yields Roles, not styles; presentation colours them
            - pkg: github.com/charmbracelet
              desc: rendering yields Roles, not styles; presentation colours them
        jsonparser:
          files:
            - '**/internal/infrastructure/jsonparser/**'
          deny:
            - pkg: github.com/ytakahashi/pino/internal/infrastructure/filestore
            - pkg: github.com/ytakahashi/pino/internal/presentation
            - pkg: os
              desc: the parser only deals with byte slices
        filestore:
          files:
            - '**/internal/infrastructure/filestore/**'
          deny:
            - pkg: github.com/ytakahashi/pino/internal/infrastructure/jsonparser
            - pkg: github.com/ytakahashi/pino/internal/presentation
            - pkg: github.com/tailscale/hujson
              desc: filestore does not know the bytes are JSON
        presentation:
          files:
            - '**/internal/presentation/**'
          deny:
            - pkg: github.com/ytakahashi/pino/internal/infrastructure
              desc: cli injects the concrete adapters
        # The end-to-end tests are the one place that may name every layer at
        # once, and they say so here rather than escaping the layering by
        # having no rule written for them. The list is what they need: pino
        # itself, the UI libraries the program is driven through, and the
        # standard library.
        e2e:
          files:
            - '**/internal/e2e/**'
          allow:
            - $gostd
            - github.com/ytakahashi/pino
            - charm.land
            - github.com/charmbracelet
        # main exists to hand the process over to cli and to turn what comes
        # back into an exit code. Everything else it could reach is reachable
        # through cli, where it can be tested without starting a process.
        cmd:
          files:
            - '**/cmd/**'
          deny:
            - pkg: github.com/ytakahashi/pino/internal/domain
            - pkg: github.com/ytakahashi/pino/internal/application
            - pkg: github.com/ytakahashi/pino/internal/infrastructure
            - pkg: github.com/ytakahashi/pino/internal/presentation
