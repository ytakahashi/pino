version: '3'

vars:
  BIN: '{{.ROOT_DIR}}/bin'
  DIST: '{{.ROOT_DIR}}/dist'
  # .golangci-lint-version is the single source of truth for the linter version.
  GOLANGCI_VERSION:
    sh: cat .golangci-lint-version
  # `golangci-lint version` prints the number without the leading "v".
  GOLANGCI_SEMVER:
    sh: sed 's/^v//' .golangci-lint-version
  DPRINT_VERSION:
    sh: cat .dprint-version

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  tools:
    desc: Install development tools into bin/
    deps: [tools:golangci-lint, tools:dprint]

  tools:golangci-lint:
    internal: true
    status:
      - test -x {{.BIN}}/golangci-lint
      - '{{.BIN}}/golangci-lint version 2>&1 | grep -q {{.GOLANGCI_SEMVER}}'
    cmds:
      # The release binaries are tested by the golangci-lint maintainers and do
      # not share dependencies with the application module.
      - >-
        curl -sSfL
        https://golangci-lint.run/install.sh
        | sh -s -- -b {{.BIN}} {{.GOLANGCI_VERSION}}

  tools:dprint:
    internal: true
    status:
      - test -x {{.BIN}}/dprint
      - '{{.BIN}}/dprint --version | grep -q {{.DPRINT_VERSION}}'
    cmds:
      # dprint's install.sh appends /bin to DPRINT_INSTALL.
      - >-
        curl -fsSL https://dprint.dev/install.sh
        | DPRINT_INSTALL={{.ROOT_DIR}} sh -s {{.DPRINT_VERSION}}

  fmt:
    desc: Format the code
    deps: [tools]
    cmds:
      - '{{.BIN}}/golangci-lint fmt'
      - '{{.BIN}}/dprint fmt --incremental=false'

  lint:
    desc: Run every linter
    cmds:
      - task: lint:go
      - task: lint:markdown

  lint:go:
    desc: Run static analysis (formatting diffs are reported too)
    deps: [tools:golangci-lint]
    cmds:
      # Formatters configured under `formatters` also run as linters here,
      # so a separate `fmt --diff` pass is unnecessary.
      - '{{.BIN}}/golangci-lint run'

  lint:markdown:
    desc: Check Markdown formatting
    deps: [tools:dprint]
    cmds:
      - '{{.BIN}}/dprint check --incremental=false'

  test:
    desc: Run the tests
    cmds:
      - go test ./... -race

  build:
    desc: Build the binary into bin/
    cmds:
      - go build -o {{.BIN}}/pino ./cmd/pino

  dist:
    desc: Cross-build release archives into dist/
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      PLATFORMS: darwin/arm64 linux/amd64 linux/arm64
    cmds:
      - rm -rf "{{.DIST}}"
      - mkdir -p "{{.DIST}}"
      - |
        set -eu
        for platform in {{.PLATFORMS}}; do
          os="${platform%/*}"
          arch="${platform#*/}"
          staging_dir="{{.DIST}}/${os}_${arch}"
          archive="{{.DIST}}/pino_{{.VERSION}}_${os}_${arch}.tar.gz"

          mkdir -p "${staging_dir}"
          # pino has no cgo dependency, so cross-built binaries can be
          # distributed without a target-specific C toolchain.
          CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
            go build -trimpath -o "${staging_dir}/pino" ./cmd/pino
          cp LICENSE README.md "${staging_dir}/"
          tar -czf "${archive}" -C "${staging_dir}" pino LICENSE README.md
        done
      - cd "{{.DIST}}" && shasum -a 256 pino_*.tar.gz > checksums.txt

  check:
    desc: Run every check
    cmds:
      - task: lint
      - task: test
      - task: build
